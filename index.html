<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梦回之镜 · 第1场试跑</title>
<style>
  :root {
    --warm: #f5c97a;
    --warm-deep: #c4782a;
    --ink: #2a1a0a;
    --box: rgba(28, 16, 8, 0.88);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #1a0f08;
    color: #fff;
    user-select: none;
  }
  #app {
    width: 100%; height: 100%;
    max-width: 1280px;
    margin: 0 auto;
    position: relative;
    background: #000;
  }

  /* —— 首页 —— */
  #title-screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      linear-gradient(180deg, rgba(60,25,10,0.45), rgba(20,8,4,0.78)),
      #1a0f08 url("assets/bg-dorm.jpg") center center / cover no-repeat;
    z-index: 20;
  }
  #title-screen.hidden { display: none; }
  .title-main {
    font-size: clamp(42px, 7vw, 72px);
    letter-spacing: 0.35em;
    font-weight: 600;
    text-shadow: 0 4px 24px rgba(0,0,0,0.7);
    margin-bottom: 8px;
    padding-left: 0.35em;
  }
  .title-sub {
    font-size: 14px;
    letter-spacing: 0.4em;
    opacity: 0.75;
    margin-bottom: 48px;
    color: var(--warm);
  }
  #btn-start {
    padding: 14px 56px;
    font-size: 18px;
    letter-spacing: 0.3em;
    border: 1.5px solid var(--warm);
    background: rgba(196,120,42,0.25);
    color: #fff;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s, transform 0.15s;
  }
  #btn-start:hover {
    background: rgba(196,120,42,0.55);
    transform: translateY(-2px);
  }
  .hint-key {
    margin-top: 28px;
    font-size: 12px;
    opacity: 0.55;
    letter-spacing: 0.1em;
  }

  /* —— 游戏画面 —— */
  #game {
    position: absolute; inset: 0;
    display: none;
  }
  #game.active { display: block; }
  #bg {
    position: absolute; inset: 0;
    background: #1a0f08 url("assets/bg-dorm.jpg") center center / cover no-repeat;
    filter: sepia(0.2) saturate(1.2) brightness(0.95);
    transition: filter 0.6s, opacity 0.6s;
  }
  #bg.cut {
    filter: sepia(0.4) saturate(1.35) brightness(0.88);
  }
  #sprites {
    position: absolute;
    left: 0; right: 0;
    bottom: 155px;
    height: calc(100% - 165px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 1.5%;
    pointer-events: none;
    padding: 0 3%;
    z-index: 2;
  }
  .sprite {
    height: 88%;
    width: auto;
    max-width: 32%;
    object-fit: contain;
    object-position: bottom center;
    opacity: 0;
    transform: translateY(28px) scale(0.94);
    transition: opacity 0.35s, transform 0.35s, filter 0.35s, drop-shadow 0.35s;
    filter: brightness(0.52) saturate(0.75);
    -webkit-filter: brightness(0.52) saturate(0.75);
  }
  .sprite.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: brightness(0.72) saturate(0.9) drop-shadow(0 8px 18px rgba(0,0,0,0.45));
    -webkit-filter: brightness(0.72) saturate(0.9) drop-shadow(0 8px 18px rgba(0,0,0,0.45));
  }
  .sprite.active {
    filter: brightness(1.08) saturate(1.12) drop-shadow(0 10px 22px rgba(0,0,0,0.5));
    -webkit-filter: brightness(1.08) saturate(1.12) drop-shadow(0 10px 22px rgba(0,0,0,0.5));
    transform: translateY(-6px) scale(1.06);
    z-index: 3;
  }
  .sprite.dim {
    filter: brightness(0.42) saturate(0.65) drop-shadow(0 6px 14px rgba(0,0,0,0.4));
    -webkit-filter: brightness(0.42) saturate(0.65) drop-shadow(0 6px 14px rgba(0,0,0,0.4));
    transform: translateY(0) scale(0.96);
    z-index: 1;
  }

  /* 对话框 */
  #dialogue {
    position: absolute;
    left: 4%; right: 4%; bottom: 3.5%;
    z-index: 10;
    min-height: 150px;
    background: var(--box);
    border: 1px solid rgba(245,201,122,0.35);
    border-radius: 10px;
    padding: 18px 24px 22px;
    backdrop-filter: blur(6px);
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  #name-tag {
    display: inline-block;
    min-height: 1.2em;
    margin-bottom: 8px;
    padding: 2px 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--ink);
    background: linear-gradient(90deg, var(--warm), #e8a84a);
    border-radius: 3px;
  }
  #name-tag.empty {
    background: transparent;
    color: transparent;
    padding: 0;
  }
  #text {
    font-size: 18px;
    line-height: 1.7;
    letter-spacing: 0.04em;
    color: #f8f0e4;
    min-height: 3.4em;
    white-space: pre-wrap;
  }
  #text.narration {
    color: #e8d4b8;
    font-style: italic;
  }
  #next-hint {
    position: absolute;
    right: 18px; bottom: 10px;
    font-size: 12px;
    opacity: 0.45;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.7; }
  }

  /* 结束层 */
  #end-screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(12,6,2,0.82);
    z-index: 30;
    text-align: center;
    padding: 24px;
  }
  #end-screen.show { display: flex; }
  #end-screen h2 {
    font-size: 32px;
    letter-spacing: 0.25em;
    margin-bottom: 16px;
    color: var(--warm);
  }
  #end-screen p {
    font-size: 15px;
    line-height: 1.8;
    opacity: 0.85;
    max-width: 420px;
  }
  #btn-replay {
    margin-top: 28px;
    padding: 10px 36px;
    border: 1px solid var(--warm);
    background: transparent;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.2em;
    border-radius: 4px;
  }
  #btn-replay:hover { background: rgba(196,120,42,0.35); }

  #scene-label {
    position: absolute;
    top: 16px; left: 20px;
    font-size: 12px;
    letter-spacing: 0.15em;
    opacity: 0.55;
    z-index: 5;
    color: var(--warm);
  }
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <div id="title-screen">
    <div class="title-main">梦回之镜</div>
    <div class="title-sub">第 1 场 · 寝室闪回 试跑</div>
    <button id="btn-start" type="button">开 始</button>
    <div class="hint-key">点击对话框 / 空格 / Enter 推进对白</div>
  </div>

  <!-- 游戏 -->
  <div id="game">
    <div id="bg"></div>
    <div id="scene-label">1. 内景 · 大学寝室 · 傍晚（闪回 / 暖色调）</div>
    <div id="sprites">
      <img id="sp-rui" class="sprite" src="assets/char-rui.png" alt="睿睿" />
      <img id="sp-limo" class="sprite" src="assets/char-limo.png" alt="李沫" />
      <img id="sp-meng" class="sprite" src="assets/char-meng.png" alt="孟子玥" />
    </div>
    <div id="dialogue">
      <div id="name-tag" class="empty">　</div>
      <div id="text"></div>
      <div id="next-hint">▼</div>
    </div>
  </div>

  <!-- 结束 -->
  <div id="end-screen">
    <h2>第 1 场完</h2>
    <p>已演完寝室闪回至「2034-03-28 / 发誓」一段。<br/>后续重庆空镜与片头不在本试跑范围内。</p>
    <button id="btn-replay" type="button">再看一遍</button>
  </div>
</div>

<script>
/* 第1场对白：到约定 2034-03-28 / 发誓完整演完 */
const SCRIPT = [
  { speaker: null, text: "镜头对准寝室门把手。门被推开，室内灯光瞬间亮起。", show: [] },
  { speaker: null, text: "李沫站在门口，愣住了。她脸上带着一天课后的疲惫，瞬间被眼前的景象击中。", show: ["limo"] },
  { speaker: null, text: "寝室被精心布置过，彩带和气球点缀其间。", show: ["limo"] },
  { speaker: null, text: "睿睿一个箭步冲上来，脸上带着恶作剧得逞的坏笑，把一个亮闪闪的生日皇冠「啪」地扣在李沫头上。", show: ["limo", "rui"], focus: "rui" },
  { speaker: "睿睿", text: "SUPRISE！", show: ["limo", "rui"], focus: "rui" },
  { speaker: null, text: "孟子玥从寝室深处走来，双手小心翼翼地捧着一个点着蜡烛的生日蛋糕。烛光在她带笑的脸上跳跃。", show: ["limo", "rui", "meng"], focus: "meng" },
  { speaker: null, text: "孟子玥和睿睿开始唱生日歌，跑调但充满热情。", show: ["limo", "rui", "meng"] },
  { speaker: "孟子玥 & 睿睿", text: "祝你生日快乐～祝你生日快乐～", show: ["limo", "rui", "meng"], focus: "meng" },
  { speaker: null, text: "李沫看着她们，眼眶微微发红，嘴角不受控制地上扬。她用手半捂住嘴，难以置信地摇头。", show: ["limo", "rui", "meng"], focus: "limo" },
  { speaker: null, text: "歌声结束。孟子玥将蛋糕举到李沫面前。", show: ["limo", "rui", "meng"], focus: "meng" },
  { speaker: "孟子玥", text: "生日快乐，李沫！", show: ["limo", "rui", "meng"], focus: "meng" },
  { speaker: "睿睿", text: "生日快乐欧！", show: ["limo", "rui", "meng"], focus: "rui" },
  { speaker: null, text: "李沫深吸一口气，假装抹眼泪。", show: ["limo", "rui", "meng"], focus: "limo" },
  { speaker: "李沫", text: "谢谢你们……我还以为你们忘了呢。", show: ["limo", "rui", "meng"], focus: "limo" },

  /* 【切至】后半 */
  { speaker: null, text: "【切至】", show: [], cut: true },
  { speaker: null, text: "桌上杯盘狼藉，是吃剩的蛋糕和烧烤签子。三个人围坐着，脸上泛着红光，笑声不断。", show: ["limo", "rui", "meng"], cut: true },
  { speaker: null, text: "李沫靠在椅背上，眼神有些迷离，带着酒后的真诚。", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "李沫", text: "哎，你俩知道吗？我刚许的愿望就是……我们仨，每年生日都能像现在这样，在一起。", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "睿睿", text: "哎哟，整这么肉麻！你不是还想要继续念书吗？要是我们都不在一个城市了，怎么办？", show: ["limo", "rui", "meng"], focus: "rui", cut: true },
  { speaker: null, text: "李沫愣了一下，眼神黯淡了一瞬，随即又亮起来。", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "李沫", text: "嗯……好吧，那不然我们来个约定！等我30岁这天，不管我们在哪儿、在干嘛，都回到学校这里，怎么样？", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "孟子玥", text: "我觉得可以！睿睿你呢？", show: ["limo", "rui", "meng"], focus: "meng", cut: true },
  { speaker: null, text: "睿睿做思考状，看看李沫，又看看孟子玥，点点头。", show: ["limo", "rui", "meng"], focus: "rui", cut: true },
  { speaker: "睿睿", text: "你30岁，那就是2034年的3月28日，行。", show: ["limo", "rui", "meng"], focus: "rui", cut: true },
  { speaker: null, text: "李沫用肩膀撞了一下睿睿。", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "李沫", text: "真的假的？不来的人，一辈子发不了财哈！", show: ["limo", "rui", "meng"], focus: "limo", cut: true },
  { speaker: "睿睿", text: "我靠！你这个誓言也太恶毒了吧！", show: ["limo", "rui", "meng"], focus: "rui", cut: true },
  { speaker: "孟子玥", text: "哈哈哈，你就说你敢不敢嘛！", show: ["limo", "rui", "meng"], focus: "meng", cut: true },
  { speaker: "睿睿", text: "我有什么不敢的！我倒要看看，我们三个最后谁一辈子发不了财！", show: ["limo", "rui", "meng"], focus: "rui", cut: true },
  { speaker: null, text: "三人的笑声混杂在一起，充满了整个房间。", show: ["limo", "rui", "meng"], cut: true },
];

const sp = {
  limo: document.getElementById("sp-limo"),
  meng: document.getElementById("sp-meng"),
  rui: document.getElementById("sp-rui"),
};
const nameTag = document.getElementById("name-tag");
const textEl = document.getElementById("text");
const bg = document.getElementById("bg");
const titleScreen = document.getElementById("title-screen");
const game = document.getElementById("game");
const endScreen = document.getElementById("end-screen");

let idx = -1;
let playing = false;

function setSprites(show, focus) {
  const keys = ["limo", "meng", "rui"];
  keys.forEach((k) => {
    const el = sp[k];
    const on = show && show.includes(k);
    el.classList.toggle("show", !!on);
    el.classList.toggle("active", !!on && focus === k);
    el.classList.toggle("dim", !!on && focus && focus !== k);
  });
}

function render(line) {
  if (!line) return;
  if (line.speaker) {
    nameTag.textContent = line.speaker;
    nameTag.classList.remove("empty");
    textEl.classList.remove("narration");
  } else {
    nameTag.textContent = "　";
    nameTag.classList.add("empty");
    textEl.classList.add("narration");
  }
  textEl.textContent = line.text;
  setSprites(line.show || [], line.focus || null);
  bg.classList.toggle("cut", !!line.cut);
}

function next() {
  if (!playing) return;
  idx += 1;
  if (idx >= SCRIPT.length) {
    playing = false;
    endScreen.classList.add("show");
    return;
  }
  render(SCRIPT[idx]);
}

function startGame() {
  titleScreen.classList.add("hidden");
  game.classList.add("active");
  endScreen.classList.remove("show");
  idx = -1;
  playing = true;
  next();
}

function replay() {
  endScreen.classList.remove("show");
  idx = -1;
  playing = true;
  next();
}

document.getElementById("btn-start").addEventListener("click", startGame);
document.getElementById("btn-replay").addEventListener("click", replay);
document.getElementById("dialogue").addEventListener("click", next);

document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" && e.code !== "Enter") return;
  e.preventDefault();
  if (!titleScreen.classList.contains("hidden")) {
    startGame();
    return;
  }
  if (endScreen.classList.contains("show")) {
    replay();
    return;
  }
  next();
});
</script>
</body>
</html>
